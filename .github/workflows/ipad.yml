name: iPad xtool development
on:
  push:
    branches: [ipad-xtool]
    paths: ['ipad/**', '.github/workflows/ipad.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipad:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test label encoder
        working-directory: ipad
        run: swift test
      - name: Install pinned xtool
        run: |
          curl --fail --location https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool.app.zip -o /tmp/xtool.zip
          ditto -x -k /tmp/xtool.zip /tmp/xtool
          find /tmp/xtool -type f -name xtool
          echo /tmp/xtool/xtool.app/Contents/Resources/bin >> "$GITHUB_PATH"
          /tmp/xtool/xtool.app/Contents/Resources/bin/xtool --version
      - name: Compile USB descriptor tests and DriverKit extension
        working-directory: ipad/Driver
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror test_descriptors.cpp -o /tmp/openlabel-usb-tests
          /tmp/openlabel-usb-tests
          brew install xcodegen
          xcodegen generate
          xcodebuild -project OpenLabelUSBDriver.xcodeproj -scheme OpenLabelUSBDriver -configuration Debug -sdk driverkit -derivedDataPath build CODE_SIGNING_ALLOWED=NO ARCHS=arm64
      - name: Build unsigned iPad app with xtool
        working-directory: ipad
        run: xtool dev build --ipa
      - name: Check IPA
        run: python3 ipad/check_ipa.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLabel-iPad-unsigned-development
          path: |
            ipad/xtool/*.ipa
            ipad/Driver/build/Build/Products/Debug-driverkit/*.dext/**
          if-no-files-found: error
