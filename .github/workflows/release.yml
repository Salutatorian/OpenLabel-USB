name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            python_arch: x64
            name: Windows-x64
          - runner: macos-15-intel
            python_arch: x64
            name: macOS-x64
          - runner: macos-15
            python_arch: arm64
            name: macOS-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install libusb (Mac)
        if: runner.os == 'macOS'
        run: brew install libusb
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -p "test_*.py"
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "OpenLabel $GITHUB_REF_NAME — first public preview" --notes-file docs/RELEASE.md --prerelease
